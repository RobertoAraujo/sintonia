<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Fundo Escuro -->
    <style>
      .bg { fill: #000000; }
    </style>

    <!-- Gradiente Balão Esquerdo (Roxo / Magenta) -->
    <linearGradient id="gradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff73e6" />
      <stop offset="40%" stop-color="#a100ff" />
      <stop offset="100%" stop-color="#4d00c8" />
    </linearGradient>

    <!-- Gradiente Balão Direito (Azul / Ciano) -->
    <linearGradient id="gradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#0072ff" />
      <stop offset="100%" stop-color="#0033ab" />
    </linearGradient>

    <!-- Gradiente da Interseção (Sobreposição) -->
    <linearGradient id="gradOverlap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#e0b3ff" stop-opacity="0.75" />
      <stop offset="70%" stop-color="#8c73ff" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#55aaff" stop-opacity="0.5" />
    </linearGradient>

    <!-- Gradiente do Brilho/Reflexo Superior -->
    <linearGradient id="gradGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Filtro de Brilho Suave (Glow) -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- MÁSCARAS PARA CRIAR A INTERSEÇÃO -->
    <!-- Forma do Balão Esquerdo -->
    <path id="pathLeft" d="M 330,160 C 424,160 500,236 500,330 C 500,385 474,434 433,465 C 385,502 280,535 235,535 C 248,495 255,475 251,460 C 196,437 160,387 160,330 C 160,236 236,160 330,160 Z" />

    <!-- Forma do Balão Direito -->
    <path id="pathRight" d="M 470,160 C 564,160 640,236 640,330 C 640,387 604,437 549,460 C 545,475 552,495 565,535 C 520,535 415,502 367,465 C 326,434 300,385 300,330 C 300,236 376,160 470,160 Z" />

    <!-- Máscara do Balão Direito para cortar o esquerdo -->
    <mask id="maskRight">
      <rect x="0" y="0" width="800" height="600" fill="#000000" />
      <use href="#pathRight" fill="#ffffff" />
    </mask>

    <!-- Máscara do Balão Esquerdo -->
    <mask id="maskLeft">
      <rect x="0" y="0" width="800" height="600" fill="#000000" />
      <use href="#pathLeft" fill="#ffffff" />
    </mask>
  </defs>

  <!-- Fundo Preto -->
  <rect class="bg" width="800" height="600" />

  <g filter="url(#glow)">
    <!-- Balão Esquerdo (Base) -->
    <use href="#pathLeft" fill="url(#gradLeft)" />

    <!-- Balão Direito (Base) -->
    <use href="#pathRight" fill="url(#gradRight)" />

    <!-- Lente de Interseção (Efeito de Vidro/Transparência) -->
    <use href="#pathLeft" mask="url(#maskRight)" fill="url(#gradOverlap)" />

    <!-- Borda Iluminada da Interseção -->
    <use href="#pathLeft" mask="url(#maskRight)" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.6" />
    <use href="#pathRight" mask="url(#maskLeft)" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4" />

    <!-- Reflexos Superiores (Gloss/Brilho) -->
    <!-- Reflexo Esquerdo -->
    <path d="M 210,300 C 230,220 300,180 370,180 C 310,185 240,220 220,300 Z" fill="url(#gradGloss)" />
    
    <!-- Reflexo Direito -->
    <path d="M 590,300 C 570,220 500,180 430,180 C 490,185 560,220 580,300 Z" fill="url(#gradGloss)" />
  </g>
</svg>